services:
  web:
    image: ghcr.io/travacry/prometey-app:latest
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./acme:/var/www/acme:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
