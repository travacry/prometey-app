server {
    listen 80;
    server_name prometey-app.ru www.prometey-app.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://prometey-app.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.prometey-app.ru;

    ssl_certificate /etc/letsencrypt/live/prometey-app.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prometey-app.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://prometey-app.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name prometey-app.ru;

    ssl_certificate /etc/letsencrypt/live/prometey-app.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prometey-app.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://web:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
